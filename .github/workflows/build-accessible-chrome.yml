name: Build accessible ImprovedTube for Chrome

on:
  push:
    branches:
      - build/chrome-accessible-es-unified
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-chrome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the reproducible integrated source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every integration against our GitHub PR source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          def git_blob(path):
              return subprocess.check_output(['git','hash-object',path],text=True).strip()
          def at(commit,path):
              return subprocess.check_output(['git','show',f'{commit}:{path}']).decode('utf-8')
          def require_same(path, sha):
              actual=git_blob(path)
              assert actual==sha, f'{path}: SHA does not match our PR ({actual} != {sha})'
          # All accessibility code and menu integration must match our own
          # final stacked PR #4335 exactly (which includes #4332-#4334).
          expected={
            'menu/accessibility.js':'824983fc16a6595ae758e6fe2110809b778fc552',
            'menu/index.html':'b0dd7708b43c3005fd8fbf0ef6b1aad11ad756b1',
            'menu/sidepanel.html':'d00749e35bf787b4e482ad7f497c83694cd2f0f0',
            'menu/index.js':'477278f4d7f2241c227046a841aea739dfb18115',
            'menu/satus.js':'bff66e7236f2a29872272417d58ab373a5c67c23',
            'js&css/extension/init.js':'051f3f89953b16eb67e5026a73a74f43e13dc278',
            'js&css/web-accessible/accessibility.js':'2dbcbb06c241475cf4bb56bb881a3ca8e7edb1e4',
            'js&css/web-accessible/init.js':'eeda0623f2181e984ae9608aacf7e16f2b960254',
            'js&css/web-accessible/www.youtube.com/appearance.js':'6f8a7d3a883d368e36d0b52856aed1413b0e248a',
            'js&css/web-accessible/www.youtube.com/shortcuts.js':'272cb2d3c808b964177f365f994a189b602d9ccf',
            'menu/skeleton-parts/appearance.js':'c146afe7ff4bfe1d7783b776e108c17ddf0bca8b',
            'menu/skeleton-parts/player.js':'08725c03a1946a6738c0e6fbe9300a2d455c8179',
            'menu/skeleton-parts/settings.js':'1a8aa51e387c72304066fef18431eb36a0f3dd48',
            '_locales/en/messages.json':'1acc2a625be1ab633d15e3ab4a1e613cd2fc25cc',
            'js&css/extension/www.youtube.com/general/general.css':'0d350b758d40c01a6bc1da192d922de2ef419602',
          }
          for path,sha in expected.items(): require_same(path,sha)
          # Chromium-only MV3 change: exact #4335 manifest minus legacy scripts.
          manifest=at('cc797df8272e7a3039523b21f63cebbd91470ffc','manifest.json')
          manifest=re.sub(r',\s*"scripts"\s*:\s*\[\s*"background\.js"\s*\]','',manifest,count=1)
          assert Path('manifest.json').read_text(encoding='utf-8')==manifest, 'Unexpected manifest changes'
          # General settings: exactly our merged PR #4336 + the switch of #4339.
          general=at('a6407a0143ead49e7227cb45cd4f078418d5771c','menu/skeleton-parts/general.js')
          anchor="\t\t\t\tleft: {"
          insertion="\t\t\t\thide_home_category_bar: {\n\t\t\t\t\tcomponent: 'switch',\n\t\t\t\t\ttext: 'hideHomeCategoryBar',\n\t\t\t\t\tstorage: 'hide_home_category_bar'\n\t\t\t\t},\n"
          assert general.count(anchor)==1, 'Cannot reproduce home category insertion'
          assert Path('menu/skeleton-parts/general.js').read_text(encoding='utf-8')==general.replace(anchor,insertion+anchor), 'Unexpected general settings changes'
          # Spanish: complete #4337 translations plus one optional #4339 label.
          translated=json.loads(at('c9c741d241e9d0a103b810b6c6166cf2b7519c8e','_locales/es/messages.json'))
          optional=json.loads(at('6932ef9535714f2365f8c6af66294d9682acb5af','_locales/es/messages.json'))
          translated['hideHomeCategoryBar']=optional['hideHomeCategoryBar']
          actual=json.loads(Path('_locales/es/messages.json').read_text(encoding='utf-8'))
          assert actual==translated, 'Spanish translations differ from PRs #4337 and #4339'
          print(f'PASS: {len(expected)} exact Git blobs + 3 reproducible PR merges')
          PY
      - name: Verify extension, accessible controls, Spanish and MV3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['manifest_version']==3
          assert manifest['background']['service_worker']=='background.js'
          assert 'scripts' not in manifest['background']
          en=json.loads((root/'_locales/en/messages.json').read_text(encoding='utf-8'))
          es=json.loads((root/'_locales/es/messages.json').read_text(encoding='utf-8'))
          missing=[key for key in en if not isinstance(es.get(key),dict) or not str(es[key].get('message','')).strip()]
          assert not missing, f'Missing Spanish messages: {missing[:20]}'
          assert 'hideHomeCategoryBar' in en and 'hideHomeCategoryBar' in es
          general=(root/'menu/skeleton-parts/general.js').read_text(encoding='utf-8')
          assert "text: 'hideWatchLaterVideos'" in general
          assert "storage: 'hide_home_category_bar'" in general
          css=(root/'js&css/extension/www.youtube.com/general/general.css').read_text(encoding='utf-8')
          assert 'it-hide-home-category-bar' in css
          for file in ('menu/accessibility.js','js&css/web-accessible/accessibility.js','menu/index.js'):
              assert (root/file).is_file(),file
          for file in ('menu/index.html','menu/sidepanel.html'):
              assert 'accessibility.js' in (root/file).read_text(encoding='utf-8')
          resources=[r for group in manifest['web_accessible_resources'] for r in group.get('resources',[])]
          assert 'js&css/web-accessible/accessibility.js' in resources
          assert 'js&css/web-accessible/accessibility.js' in (root/'js&css/extension/init.js').read_text(encoding='utf-8')
          paths=[]
          for block in manifest.get('content_scripts',[]):
              paths+=block.get('js',[])+block.get('css',[])
          paths+=resources
          paths+=list(manifest.get('background',{}).values())
          paths+=[manifest['action']['default_popup']]
          for path in paths:
              if isinstance(path,str) and not any(ch in path for ch in '*?'):
                  assert (root/path).is_file(),f'Missing manifest asset: {path}'
          print(f'PASS: {len(en)} English messages covered in Spanish; MV3 and accessibility wiring verified')
          PY
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find menu 'js&css' -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Build installation ZIP with manifest at root
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path('.')
          ignored={'.git','.github','.idea','tests','build','node_modules'}
          name='ImprovedTube-Accesible-Chrome.zip'
          with zipfile.ZipFile(name,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file() or any(s in ignored for s in p.parts) or p.name==name or p.name.startswith('.'):
                      continue
                  z.write(p,p.as_posix())
          with zipfile.ZipFile(name) as z:
              assert z.testzip() is None
              assert 'manifest.json' in z.namelist()
              print(f'PASS: {len(z.namelist())} runtime/package files in {name}')
          PY
      - name: Upload installable Chrome ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ImprovedTube-Accesible-Chrome
          path: ImprovedTube-Accesible-Chrome.zip
          if-no-files-found: error
          retention-days: 30
